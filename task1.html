<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 1 — Geometric Composition (CSS Grid)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <h1 class="page__title">Task 1 — Geometric composition</h1>
    <p class="page__hint">A single 6×6 CSS Grid. The black lines come from the grid gap, not from borders.</p>

    <div class="composition">
      <div class="block block--blue"></div>
      <div class="block block--strip"></div>
      <div class="block block--yellow"></div>
      <div class="block block--panel"></div>
      <div class="block block--red"></div>
      <div class="block block--black"></div>
      <div class="block block--corner"></div>
    </div>
  </main>
</body>
</html>
